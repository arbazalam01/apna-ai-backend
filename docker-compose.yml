# Local MongoDB plus stand-ins for AWS S3 (MinIO) and email (Mailpit): docker compose up -d
# Credentials/bucket come from .env so the app and MinIO stay in sync.
services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: pgsty/minio # maintained fork; MinIO stopped publishing images
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ACCESSKEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SECRETKEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data

  # one-shot: creates the bucket (public-read, for company logos) then exits
  minio-init:
    image: pgsty/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done &&
             mc mb --ignore-existing local/$${BUCKET} &&
             mc anonymous set download local/$${BUCKET}"
    environment:
      MINIO_ROOT_USER: ${ACCESSKEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SECRETKEY:-minioadmin}
      BUCKET: ${BUCKETNAME:-apna-ai}

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox

volumes:
  mongo-data:
  minio-data:
